name: Sidechat
description: >-
  Sidechat is an anonymous, campus-based social networking app for college
  students, built by Flower Ave Inc in New York City and backed by Canaan
  Partners. Students verify with a school email to join their college's private,
  location- and campus-scoped community where they post text, images, and polls,
  vote, and chat anonymously in a Reddit-like feed. Sidechat launched in early
  2022, acquired Yik Yak in 2023, and operates primarily as an iOS consumer app.
  It publishes no official public API, developer portal, SDK, or OpenAPI surface;
  this profile captures the company's public web presence and identity for the
  API Evangelist network.
